name: Bug 报告
description: 报告一个可复现的缺陷
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 清晰描述发生了什么，以及你期望的行为。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请提供可复现的最小步骤。
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 观察到 ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      options:
        - 前端页面 / 交互
        - 知识图谱
        - 题库 / Console 后台
        - AI 辅导 / 流式接口
        - 家长登录
        - 部署 / Cloudflare
        - 其他
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 浏览器、设备、操作系统；本地开发还是线上环境。
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 请勿粘贴任何密钥或凭据。
    validations:
      required: false
