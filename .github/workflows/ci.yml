name: 持续集成

on:
  push:
  pull_request:

# 持续集成仅需要读取仓库内容。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 代码质量检查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 构建与测试只使用公开占位值，不读取或输出生产密钥。
      AI_API_KEY: ci-placeholder-not-a-secret
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.4

      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 执行完整检查
        run: pnpm check
