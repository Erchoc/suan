name: Continuous Integration

on:
  push:
  pull_request:

# Continuous integration only needs read access to repository contents.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Builds and tests use a public placeholder and never read or print production secrets.
      BASE_URL: https://api.deepseek.com
      API_KEY: ci-placeholder-not-a-secret
      MODEL: deepseek-v4-flash
      AI_PROTOCOL: openai-chat
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run all checks
        run: pnpm run ci
