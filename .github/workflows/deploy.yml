name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Deployment only needs read access to the repository; repository secrets provide Cloudflare credentials.
permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Check and Deploy Production
    # New repositories run CI only. Configure both repository secrets and set
    # CLOUDFLARE_DEPLOY_ENABLED to true before push or manual deployments can run.
    if: vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The Cloudflare Vite plugin selects environments while building, not while deploying.
      CLOUDFLARE_ENV: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run all checks before deployment
        run: pnpm run ci
        env:
          # Build-only placeholders never replace the production Worker secrets.
          BASE_URL: https://api.deepseek.com
          API_KEY: deploy-check-placeholder-not-a-secret
          MODEL: deepseek-v4-flash
          AI_PROTOCOL: openai-chat

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: deploy
