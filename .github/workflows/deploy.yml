name: 部署到 Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 部署只需要读取仓库内容；Cloudflare 凭据由仓库机密注入。
permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: 检查并部署生产环境
    # 新仓库默认只跑 CI；配置两项仓库机密并将变量
    # CLOUDFLARE_DEPLOY_ENABLED 设为 true 后，main 推送才自动发布。
    if: github.event_name == 'workflow_dispatch' || vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 部署前检查使用公开占位值，生产 AI 密钥由 Cloudflare Worker 管理。
      AI_API_KEY: deploy-check-placeholder-not-a-secret
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.4

      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 部署前执行完整检查
        run: pnpm check

      - name: 部署到 Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: deploy
