<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- PWA and mobile metadata -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="算道" />
    <meta id="theme-color" name="theme-color" content="#faf8f3" />
    <meta id="color-scheme" name="color-scheme" content="light" />
    <meta name="description" content="小学数学知识图谱与智能诊断平台" />
    <script>
      // Synchronize the theme before the first paint so Safari samples the correct color.
      (() => {
        var theme = 'light';
        try {
          theme = localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
        } catch (_) {
          // Fall back to the light theme when storage is unavailable.
        }
        var color = theme === 'dark' ? '#0f0e17' : '#faf8f3';
        var root = document.documentElement;
        root.setAttribute('data-theme', theme);
        root.style.colorScheme = theme;
        root.style.backgroundColor = color;
        document.getElementById('theme-color').setAttribute('content', color);
        document.getElementById('color-scheme').setAttribute('content', theme);
      })();
    </script>
    <!-- Icons -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>算道 · 小学数学智能助手</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
